  <title>Story Spindle — Weave the threads of your story</title>
  <link rel="icon" type="image/png" href="assets/spindle-mark.PNG?v=20261122-custom">

<body>
  <div class="app-shell" id="app">
    <div class="main-column">
      <header class="topbar">
        <div class="topbar-start"><div class="topbar-brand"><span class="brand-mark" aria-hidden="true"><img src="assets/spindle-mark.PNG" alt=""></span><strong>Story Spindle</strong></div><div class="project-switcher"><label class="visually-hidden" for="project-select">Choose a project</label><select id="project-select"></select><button class="icon-btn" data-action="new-project" title="New novel project" aria-label="New novel project">＋</button></div></div>

      <main id="main-content" tabindex="-1"></main>

  </div>
  <div id="modal-layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
